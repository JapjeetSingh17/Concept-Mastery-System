name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Unit Tests (Offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concept-mastery/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: concept-mastery/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline pytest suite
        env:
          ENVIRONMENT: test
          OFFLINE_TEST: "1"
          SKIP_DOTENV: "1"
        run: |
          python -m pytest tests/ -k "not test_live_openrouter_execution" -v

      - name: Run live OpenRouter integration check (when secret is configured)
        env:
          ENVIRONMENT: test
          SKIP_DOTENV: "1"
          OPENROUTER_LIVE: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            python -m pytest tests/test_openrouter_gateway.py -k "test_live_openrouter_execution" -v
          else
            echo "OPENROUTER_API_KEY secret not present; skipping live OpenRouter API test."
          fi

  frontend-tests:
    name: Frontend Concurrency & Error UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend test suite
        run: node concept-mastery/frontend/tests/test_api_and_ui_concurrency.js

  docker-build:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build multi-stage Docker image
        run: docker build -f concept-mastery/Dockerfile -t concept-mastery:ci concept-mastery

